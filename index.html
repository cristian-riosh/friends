<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3E2A4E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141018" media="(prefers-color-scheme: dark)">
<title>Léxico de Friends · vocabulario por episodio</title>
<script>
try{ var t = localStorage.getItem("tema");
     if(t) document.documentElement.dataset.tema = t; }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Gentium+Book+Plus:wght@400&display=swap" rel="stylesheet">
<link rel="preload" as="fetch" href="datos/lexico.json" crossorigin>
<style>
:root{
  --fondo:#F4F2F7; --superficie:#FFFFFF; --superficie-2:#FAF8FC;
  --tinta:#1E1723; --ciruela:#3E2A4E; --ciruela-viva:#6B4A82;
  --acento:#B96E04; --verde:#186349; --tenue:#786D85; --linea:#E3DEE9;
  --sombra:0 1px 2px rgba(30,23,35,.05), 0 8px 24px -12px rgba(30,23,35,.18);
  --radio:14px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --texto:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --dato:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --fonetica:"Gentium Book Plus","Charis SIL",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --fondo:#131017; --superficie:#1C1723; --superficie-2:#221B2B;
    --tinta:#EDE7F2; --ciruela:#2A1F36; --ciruela-viva:#C3A5D8;
    --acento:#E7A63C; --verde:#5CC79A; --tenue:#9C90AA; --linea:#302739;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-tema="oscuro"]{
  --fondo:#131017; --superficie:#1C1723; --superficie-2:#221B2B;
  --tinta:#EDE7F2; --ciruela:#2A1F36; --ciruela-viva:#C3A5D8;
  --acento:#E7A63C; --verde:#5CC79A; --tenue:#9C90AA; --linea:#302739;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font-family:var(--texto);font-size:clamp(14px,.35vw + 13px,16px);line-height:1.55;
  -webkit-font-smoothing:antialiased}

/* ---------- cabecera ---------- */
.cabecera{position:sticky;top:0;z-index:30;background:var(--ciruela);color:#F7F2FA;
  padding:16px max(16px,env(safe-area-inset-left)) 16px max(16px,env(safe-area-inset-right))}
.cabecera-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{font-family:var(--display);font-weight:800;font-size:clamp(21px,1.7vw + 16px,30px);
  letter-spacing:-.02em;margin:0;line-height:1.15}
.marca span{font-weight:500;opacity:.8;display:block;letter-spacing:0;line-height:1.3;
  font-family:var(--texto);font-size:clamp(13px,.35vw + 12px,15.5px)}
.tema{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);
  color:inherit;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:17px;
  display:grid;place-items:center;padding:0;transition:background .15s}
.tema:hover{background:rgba(255,255,255,.18)}
.tema:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.totales{font-family:var(--dato);font-size:clamp(12px,.25vw + 11.5px,13.5px);opacity:.88;
  margin-left:auto;text-align:right;line-height:1.4}

/* ---------- estructura ---------- */
.marco{max-width:1320px;margin:0 auto;
  padding:18px max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right));
  display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){
  .marco{grid-template-columns:200px minmax(0,1fr);align-items:start;gap:26px}
}

/* ---------- temporadas ---------- */
.temporadas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.temporadas::-webkit-scrollbar{display:none}
@media (min-width:900px){
  .temporadas{position:sticky;top:90px;flex-direction:column;overflow:visible;gap:3px}
}
.temp{flex:0 0 auto;scroll-snap-align:start;appearance:none;border:1px solid var(--linea);
  background:var(--superficie);color:var(--tinta);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:8px;transition:background .15s,color .15s,border-color .15s}
@media (min-width:900px){
  .temp{border-radius:10px;justify-content:space-between;padding:11px 13px;font-size:14px;
    border-color:transparent;background:transparent;width:100%}
  .temp:hover{background:var(--superficie)}
  .larga{display:inline}
  .corta{display:none}
}
.temp b{font-family:var(--display);font-weight:700}
.larga{display:none}
.corta{display:inline}
.temp i{font-family:var(--dato);font-size:11px;font-style:normal;opacity:.55}
.temp[aria-current="true"]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.temp[aria-current="true"] i{opacity:.75}

/* ---------- rejilla de episodios ---------- */
.rejilla{display:grid;gap:6px;margin-bottom:16px;
  grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
@media (min-width:600px){.rejilla{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}}
.epi{position:relative;overflow:hidden;aspect-ratio:1/.86;min-height:44px;
  border:1px solid var(--linea);background:var(--superficie);border-radius:11px;cursor:pointer;
  color:var(--tinta);font-family:var(--dato);font-size:13px;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .14s cubic-bezier(.2,.8,.3,1),border-color .14s,box-shadow .14s}
.epi .relleno{position:absolute;inset:auto 0 0 0;background:var(--ciruela-viva);opacity:.13}
.epi span,.epi u{position:relative}
.epi u{text-decoration:none;font-size:9.5px;opacity:.5}
.epi:hover{transform:translateY(-2px);border-color:var(--ciruela-viva);box-shadow:var(--sombra)}
.epi[aria-current="true"]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.epi[aria-current="true"] .relleno{background:var(--acento);opacity:.5}

/* ---------- barra de controles ---------- */
.controles{position:sticky;top:78px;z-index:20;margin:0 -4px 16px;padding:10px 4px;
  background:var(--fondo)}
@media (min-width:760px){
  .controles{background:color-mix(in srgb,var(--fondo) 88%,transparent);backdrop-filter:blur(12px)}
}
@supports not (backdrop-filter:blur(1px)){.controles{background:var(--fondo)}}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,.chip{min-height:40px;border:1px solid var(--linea);border-radius:999px;background:var(--superficie);
  color:var(--tinta);font:inherit;font-size:13px;padding:0 14px;cursor:pointer}
select{border-radius:12px;padding:0 10px}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.chip:focus-visible,.epi:focus-visible,.temp:focus-visible,select:focus-visible,.decir:focus-visible{
  outline:2px solid var(--acento);outline-offset:2px}
@media (pointer:coarse){select,.chip{min-height:44px}}

/* ---------- panel de resultados ---------- */
.panel{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);overflow:hidden}
.titulo{padding:14px 16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid var(--linea)}
.titulo h2{font-family:var(--display);font-size:clamp(17px,1.1vw + 14px,20px);margin:0;font-weight:700}
.titulo .sub{font-family:var(--dato);font-size:12px;color:var(--tenue)}

/* rejilla de entradas: tabla en pantallas anchas, tarjetas en móvil */
.encabezados{display:none}
@media (min-width:760px){
  .encabezados,.entrada{display:grid;
    grid-template-columns:minmax(170px,1.1fr) minmax(130px,.7fr) minmax(190px,1.5fr) 96px;
    gap:16px;align-items:start}
  .encabezados{padding:9px 16px;border-bottom:1px solid var(--linea)}
  .encabezados span{font-family:var(--dato);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--tenue)}
  .encabezados span:last-child,.c-frec{text-align:right}
}
.entrada{padding:12px 16px;border-bottom:1px solid var(--linea)}
.entrada:last-child{border-bottom:0}
@media (hover:hover){.entrada:hover{background:var(--superficie-2)}}
.lema{font-family:var(--display);font-weight:700;font-size:clamp(16px,.6vw + 15px,18px);
  letter-spacing:-.01em;margin:0 6px 0 0;display:inline}
.pos{font-family:var(--dato);font-size:10.5px;color:var(--tenue);text-transform:lowercase}
.c-ipa{display:flex;align-items:center;gap:8px;margin-top:2px}
@media (min-width:760px){.c-ipa{margin-top:0}}
.ipa{font-family:var(--fonetica);font-size:16px;color:var(--ciruela-viva)}
.es{color:var(--verde);font-weight:500}
.nota{display:block;font-size:12px;color:var(--tenue);margin-top:2px}
.marca{display:inline-block;font-family:var(--dato);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 7px;border-radius:6px;margin-right:5px;vertical-align:2px}
.m-nueva{background:color-mix(in srgb,var(--verde) 15%,transparent);color:var(--verde)}
.m-col{background:color-mix(in srgb,var(--acento) 16%,transparent);color:var(--acento)}
.m-ext{background:color-mix(in srgb,var(--ciruela-viva) 18%,transparent);color:var(--ciruela-viva)}
.c-frec{font-family:var(--dato);font-size:12.5px;color:var(--tenue);margin-top:6px}
@media (min-width:760px){.c-frec{margin-top:2px}}
.c-frec b{color:var(--tinta);font-weight:500;font-size:14px}
.barra{display:block;height:3px;background:var(--acento);border-radius:2px;margin-top:5px;
  min-width:3px;opacity:.7}
@media (max-width:759px){.barra{display:none}}

/* botón de pronunciación */
.decir{flex:0 0 auto;appearance:none;border:1px solid var(--linea);background:var(--superficie-2);
  width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ciruela-viva);
  font-size:11px;line-height:1;padding:0;display:grid;place-items:center;
  transition:background .15s,color .15s,transform .1s}
@media (pointer:coarse){.decir{width:40px;height:40px;font-size:13px}}
.decir:hover{background:var(--ciruela-viva);color:var(--superficie);border-color:transparent}
.decir:active{transform:scale(.92)}
.decir[data-sonando="1"]{background:var(--acento);color:#fff;border-color:transparent}
body.sin-voz .decir{display:none}

/* estados */
.aviso{padding:52px 20px;text-align:center;color:var(--tenue)}
.aviso b{display:block;color:var(--tinta);font-weight:600;margin-bottom:6px;font-size:16px}
.aviso code{font-family:var(--dato);font-size:12.5px;background:var(--superficie-2);
  padding:2px 6px;border-radius:6px}
.esqueleto{padding:12px 16px;border-bottom:1px solid var(--linea)}
.esqueleto i{display:block;height:13px;border-radius:6px;background:var(--linea);
  animation:pulso 1.4s ease-in-out infinite}
.esqueleto i+i{margin-top:8px;width:55%}
@keyframes pulso{0%,100%{opacity:.45}50%{opacity:.9}}
.centinela{height:1px}
.mas{padding:16px;text-align:center;font-family:var(--dato);font-size:12px;color:var(--tenue)}
.mas button{min-height:44px;padding:0 20px;border:1px solid var(--linea);border-radius:999px;
  background:var(--superficie-2);color:var(--tinta);font:inherit;font-size:13px;cursor:pointer;
  display:block;margin:8px auto 0}
.mas button:hover{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.miau{appearance:none;border:1px dashed var(--linea);background:transparent;color:var(--tenue);
  border-radius:999px;padding:5px 12px;font:inherit;font-size:11.5px;cursor:pointer;margin-left:8px;
  opacity:.55;transition:opacity .15s,border-color .15s}
.miau:hover{opacity:1;border-color:var(--acento);color:var(--acento)}
.miau:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.gatos{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;
  background:transparent}
.gatos img{width:min(78vw,460px);height:auto;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.35));
  animation:asomar .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes asomar{
  from{opacity:0;transform:translateY(28px) scale(.9) rotate(-3deg)}
  to{opacity:1;transform:none}
}
.gatos.yendose img{animation:irse .35s ease-in both}
@keyframes irse{ to{opacity:0;transform:translateY(18px) scale(.95)} }
@media (prefers-reduced-motion:reduce){
  .gatos img,.gatos.yendose img{animation:none}
}
.pie{max-width:1320px;margin:0 auto;padding:0 20px 40px;color:var(--tenue);font-size:12px}
kbd{font-family:var(--dato);font-size:11px;border:1px solid var(--linea);border-bottom-width:2px;
  border-radius:5px;padding:1px 5px;background:var(--superficie)}
@media (max-width:759px){.solo-ancho{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="cabecera">
  <div class="cabecera-in">
    <h1 class="marca">Léxico de Friends<span>vocabulario por episodio</span></h1>
    <div class="totales" id="totales">cargando…</div>
    <button class="tema" id="tema" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
  </div>
</header>

<div class="marco">
  <nav class="temporadas" id="temporadas" aria-label="Temporadas"></nav>

  <main>
    <div class="rejilla" id="rejilla" aria-label="Episodios"></div>

    <div class="controles">
      <div class="fila">
        <select id="orden" aria-label="Ordenar resultados">
          <option value="frec">Más frecuentes</option>
          <option value="alfa">Alfabético</option>
          <option value="total">Frecuencia en la serie</option>
        </select>
        <select id="cat" aria-label="Categoría gramatical">
          <option value="">Todas</option>
          <option value="NOUN">Sustantivos</option>
          <option value="VERB">Verbos</option>
          <option value="ADJ">Adjetivos</option>
          <option value="ADV">Adverbios</option>
        </select>
        <button class="chip" id="f-nuevas" aria-pressed="false">Nuevas</button>
        <button class="chip" id="f-col" aria-pressed="false">Coloquiales</button>
        <button class="chip" id="f-ext" aria-pressed="false">Extranjeras</button>
        <select id="vel" aria-label="Velocidad de la pronunciación" title="Velocidad de la voz">
          <option value="1">Voz normal</option>
          <option value="0.8" selected>Voz pausada</option>
          <option value="0.65">Voz muy lenta</option>
        </select>
        <select id="rep" aria-label="Repeticiones de la pronunciación" title="Repeticiones">
          <option value="0" selected>Sin repetir</option>
          <option value="1">Repetir 1 vez</option>
          <option value="2">Repetir 2 veces</option>
          <option value="3">Repetir 3 veces</option>
          <option value="4">Repetir 4 veces</option>
          <option value="5">Repetir 5 veces</option>
        </select>
      </div>
    </div>

    <section class="panel" aria-live="polite">
      <div class="titulo"><h2 id="titulo">—</h2><span class="sub" id="subtitulo"></span></div>
      <div class="encabezados" aria-hidden="true">
        <span>Palabra</span><span>Fonética</span><span>Español</span><span>Frecuencia</span>
      </div>
      <div id="contenido">
        <div class="esqueleto"><i></i><i></i></div>
        <div class="esqueleto"><i></i><i></i></div>
        <div class="esqueleto"><i></i><i></i></div>
      </div>
      <div class="centinela" id="centinela"></div>
    </section>
  </main>
</div>

<footer class="pie">
  <span class="solo-ancho"><kbd>←</kbd> <kbd>→</kbd> cambian de episodio · </span>
  Filtro de vocabulario básico: Zipf ≤ 4,3.
  <button class="miau" id="miau" type="button">miau</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const [L_LEMA,L_POS,L_IPA,L_ES,L_STD,L_IDI,L_TOT] = [0,1,2,3,4,5,6];
const POR_TANDA = 60;
const TOPE_AUTO = 300;          /* a partir de aqui hace falta pulsar: evita
                                   acumular decenas de miles de nodos en el DOM */
const COMPARAR = new Intl.Collator("es").compare;

const IDIOMAS = {frances:"fr-FR", italiano:"it-IT", aleman:"de-DE", espanol:"es-ES"};
const sintesis = window.speechSynthesis;
let voces = [];
let velocidad = 0.8;      /* por debajo de 0,6 el sintetizador distorsiona */
let repeticiones = 0;     /* escuchas adicionales tras la primera */
let tempVoz, tokenVoz = 0, botonActivo = null;
const PAUSA = 480;        /* silencio entre repeticiones, en ms */
function cargarVoces(){ voces = sintesis ? sintesis.getVoices() : []; }
if(sintesis){ cargarVoces(); sintesis.addEventListener?.("voiceschanged", cargarVoces); }
else { document.body.classList.add("sin-voz"); }

function pronunciar(palabra, idioma, boton){
  if(!sintesis) return;
  /* cancelar lo anterior: el token invalida las repeticiones ya programadas */
  sintesis.cancel();
  clearTimeout(tempVoz);
  if(botonActivo) delete botonActivo.dataset.sonando;
  const miTurno = ++tokenVoz;
  botonActivo = boton || null;
  if(boton) boton.dataset.sonando = "1";

  const raiz = idioma.slice(0,2);
  const voz = voces.find(v => v.lang === idioma) || voces.find(v => v.lang.startsWith(raiz));
  let quedan = repeticiones;

  const decir = () => {
    if(miTurno !== tokenVoz) return;
    const frase = new SpeechSynthesisUtterance(palabra);
    frase.lang = idioma;
    frase.rate = velocidad;
    if(voz) frase.voice = voz;
    frase.onend = frase.onerror = () => {
      if(miTurno !== tokenVoz) return;
      if(quedan > 0){ quedan--; tempVoz = setTimeout(decir, PAUSA); }
      else if(boton){ delete boton.dataset.sonando; botonActivo = null; }
    };
    sintesis.speak(frase);
  };
  decir();
}

let EPS = [], LEX = [], DEBUT = [];
const cacheTemp = new Map();
const estado = { ep:null, temp:1, orden:"frec", cat:"",
                 nuevas:false, col:false, ext:false };
let visibles = [], pintadas = 0, topeFrec = 1;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function traer(ruta){
  const r = await fetch(ruta);
  if(!r.ok) throw new Error(ruta + " respondió " + r.status);
  return r.json();
}
async function temporada(t){
  if(!cacheTemp.has(t)) cacheTemp.set(t, await traer("datos/t" + String(t).padStart(2,"0") + ".json"));
  return cacheTemp.get(t);
}

/* ---------- navegación ---------- */
function pintarTemporadas(){
  const cont = $("#temporadas"); cont.innerHTML = "";
  for(let t=1;t<=10;t++){
    const deT = EPS.filter(e=>e.t===t);
    const b = document.createElement("button");
    b.className="temp"; b.type="button";
    b.setAttribute("aria-current", t===estado.temp);
    b.innerHTML = '<b><span class="larga">Temporada </span><span class="corta">T</span>' +
                  t + "</b><i>" + deT.length + "</i>";
    b.onclick = () => irA(deT[0].id);
    cont.appendChild(b);
  }
}
function pintarRejilla(){
  const cont = $("#rejilla"); cont.innerHTML = "";
  const maxC = Math.max(...EPS.map(e=>e.c));
  EPS.filter(e=>e.t===estado.temp).forEach(e=>{
    const b = document.createElement("button");
    b.className="epi"; b.type="button";
    b.setAttribute("aria-current", e.id===estado.ep);
    b.setAttribute("aria-label", e.id + ", " + e.c + " palabras");
    b.title = e.id + " · " + e.c + " palabras";
    /* la altura del relleno codifica cuánto vocabulario aporta el episodio */
    const alto = Math.round(100*e.c/maxC);
    b.innerHTML = '<span class="relleno" style="height:' + alto + '%"></span>' +
                  "<span>" + String(e.n).padStart(2,"0") + "</span><u>" + e.c + "</u>";
    b.onclick = () => irA(e.id);
    cont.appendChild(b);
  });
}
async function irA(id){
  estado.ep = id;
  estado.temp = EPS.find(e=>e.id===id).t;
  history.replaceState(null, "", "#" + id);
  pintarTemporadas(); pintarRejilla();
  await refrescar();
}

/* ---------- selección de filas ---------- */
async function calcular(){
  const datos = await temporada(estado.temp);
  const base = (datos[estado.ep] || []).map(par => ({i:par[0], f:par[1]}));
  const posEp = EPS.findIndex(e=>e.id===estado.ep);
  return base.filter(o => {
    const L = LEX[o.i];
    if(estado.cat && L[L_POS]!==estado.cat) return false;
    if(estado.col && !L[L_STD]) return false;
    if(estado.ext && !L[L_IDI]) return false;
    if(estado.nuevas && DEBUT[o.i]!==posEp) return false;
    return true;
  }).sort((a,b)=>{
    if(estado.orden==="alfa")  return COMPARAR(LEX[a.i][L_LEMA], LEX[b.i][L_LEMA]);
    if(estado.orden==="total") return LEX[b.i][L_TOT]-LEX[a.i][L_TOT];
    return b.f-a.f || COMPARAR(LEX[a.i][L_LEMA], LEX[b.i][L_LEMA]);
  });
}

function entrada(o, posEp, maxF){
  const L = LEX[o.i];
  const marcas =
    (DEBUT[o.i]===posEp ? '<span class="marca m-nueva">nueva</span>' : "") +
    (L[L_STD] ? '<span class="marca m-col">coloquial</span>' : "") +
    (L[L_IDI] ? '<span class="marca m-ext">' + esc(L[L_IDI]) + "</span>" : "");
  const nota  = L[L_STD] ? '<span class="nota">forma estándar: ' + esc(L[L_STD]) + "</span>" : "";
  const cifra = "<b>" + o.f + "</b> aquí · " + L[L_TOT] + " total";
  return '<article class="entrada">' +
    "<div>" + marcas + '<h3 class="lema">' + esc(L[L_LEMA]) + "</h3>" +
      '<span class="pos">' + L[L_POS].toLowerCase() + "</span></div>" +
    '<div class="c-ipa"><span class="ipa">' + esc(L[L_IPA]) + "</span>" +
      '<button class="decir" type="button" data-p="' + esc(L[L_LEMA]) + '" data-l="' +
      (IDIOMAS[L[L_IDI]] || "en-US") + '" aria-label="Escuchar ' + esc(L[L_LEMA]) +
      '" title="Escuchar">&#9654;</button></div>' +
    '<div><span class="es">' + (esc(L[L_ES]) || "—") + "</span>" + nota + "</div>" +
    '<div class="c-frec">' + cifra +
      '<span class="barra" style="width:' + Math.max(4, Math.round(100*o.f/maxF)) + '%"></span></div>' +
    "</article>";
}

function pintarTanda(forzado){
  if(pintadas >= visibles.length) return;
  if(!forzado && pintadas >= TOPE_AUTO){ avisoFinal(); return; }
  const posEp = EPS.findIndex(e=>e.id===estado.ep);
  /* el maximo se calcula sobre todo el conjunto: con orden alfabetico
     el primer elemento no es el mas frecuente */
  const trozo = visibles.slice(pintadas, pintadas + POR_TANDA);
  const cont = $("#contenido");
  cont.insertAdjacentHTML("beforeend",
    trozo.map(o => entrada(o, posEp, topeFrec)).join(""));
  pintadas += trozo.length;
  avisoFinal();
}

function avisoFinal(){
  const cont = $("#contenido");
  const previo = document.getElementById("mas");
  if(previo) previo.remove();
  if(pintadas >= visibles.length) return;
  const resto = visibles.length - pintadas;
  const texto = pintadas + " de " + visibles.length;
  cont.insertAdjacentHTML("beforeend", pintadas >= TOPE_AUTO
    ? '<p class="mas" id="mas">' + texto +
      '<button type="button" id="cargar-mas">Mostrar ' + Math.min(resto, POR_TANDA) +
      " más</button></p>"
    : '<p class="mas" id="mas">' + texto + " · sigue bajando</p>");
}

async function refrescar(){
  const cont = $("#contenido");
  try { visibles = await calcular(); }
  catch(err){
    cont.innerHTML = '<p class="aviso"><b>No se pudieron cargar los datos</b>' + esc(err.message) +
      '. Comprueba que la carpeta <code>datos/</code> esté junto al HTML.</p>';
    return;
  }
  const ep = EPS.find(e=>e.id===estado.ep);
  $("#titulo").textContent = ep.id;
  $("#subtitulo").textContent =
    visibles.length + " de " + ep.c + " palabras · T" + ep.t + " E" + ep.n;

  topeFrec = Math.max(1, ...visibles.map(o => o.f));
  cont.innerHTML = "";
  pintadas = 0;
  if(!visibles.length){
    cont.innerHTML = '<p class="aviso"><b>Ningún resultado</b>' +
      "Prueba a quitar alguno de los filtros activos.</p>";
    return;
  }
  pintarTanda();
}

/* ---------- eventos ---------- */
$("#orden").addEventListener("change", e => { estado.orden = e.target.value; refrescar(); });
$("#vel").addEventListener("change", e => {
  velocidad = parseFloat(e.target.value);
  try{ localStorage.setItem("velocidad", e.target.value); }catch(err){}
});
$("#rep").addEventListener("change", e => {
  repeticiones = parseInt(e.target.value, 10);
  try{ localStorage.setItem("repeticiones", e.target.value); }catch(err){}
});
$("#cat").addEventListener("change",   e => { estado.cat   = e.target.value; refrescar(); });
[["#f-nuevas","nuevas"],["#f-col","col"],["#f-ext","ext"]].forEach(par => {
  $(par[0]).addEventListener("click", e => {
    estado[par[1]] = !estado[par[1]];
    e.currentTarget.setAttribute("aria-pressed", estado[par[1]]);
    refrescar();
  });
});
$("#contenido").addEventListener("click", e => {
  const b = e.target.closest(".decir");
  if(b){ pronunciar(b.dataset.p, b.dataset.l, b); return; }
  if(e.target.closest("#cargar-mas")) pintarTanda(true);
});
document.addEventListener("keydown", e => {
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"){
    if(e.key==="Escape") e.target.blur();
    return;
  }
  const k = EPS.findIndex(x=>x.id===estado.ep);
  if(e.key==="ArrowRight" && k<EPS.length-1) irA(EPS[k+1].id);
  if(e.key==="ArrowLeft"  && k>0)            irA(EPS[k-1].id);
});
if("IntersectionObserver" in window){
  new IntersectionObserver(entradas => {
    if(entradas[0].isIntersecting) pintarTanda(false);
  }, {rootMargin:"600px"}).observe($("#centinela"));
}
addEventListener("hashchange", () => {
  const e = EPS.find(x=>x.id===location.hash.slice(1));
  if(e && e.id!==estado.ep) irA(e.id);
});

function pintarTema(){
  const manual = document.documentElement.dataset.tema;
  const oscuro = manual
    ? manual === "oscuro"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#tema").textContent = oscuro ? "☀" : "☾";
  $("#tema").setAttribute("aria-label", oscuro ? "Cambiar a tema claro" : "Cambiar a tema oscuro");
}
$("#tema").addEventListener("click", () => {
  const manual = document.documentElement.dataset.tema;
  const oscuroAhora = manual
    ? manual === "oscuro"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const nuevo = oscuroAhora ? "claro" : "oscuro";
  document.documentElement.dataset.tema = nuevo;
  try{ localStorage.setItem("tema", nuevo); }catch(err){}
  pintarTema();
});
try{
  const v = localStorage.getItem("velocidad");
  if(v){ velocidad = parseFloat(v); $("#vel").value = v; }
  const r = localStorage.getItem("repeticiones");
  if(r){ repeticiones = parseInt(r, 10); $("#rep").value = r; }
}catch(err){}
pintarTema();

/* ---------- gatos ---------- */
/* El maullido se sintetiza en el navegador: sin archivo de audio.
   Diente de sierra con arco de tono ascendente-descendente, filtrado por dos
   formantes que recorren /i/ -> /a/ -> /u/, que es lo que da el "miau". */
let audio = null, clip = null;

/* Reproduce la grabacion. Si el navegador la bloquea o falla, recurre a la
   sintesis, para que el huevo de pascua nunca se quede mudo. */
function maullar(retraso, tono){
  try{
    if(!clip){ clip = new Audio("datos/miau.mp3"); clip.preload = "auto"; }
    const a = new Audio(clip.src);          /* instancia propia: pueden solaparse */
    a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = false;
    a.playbackRate = tono;                  /* al no preservar el tono, cambia el timbre */
    a.volume = 0.9;
    setTimeout(() => { a.play().catch(() => sintetizar(0, tono)); }, retraso*1000);
  }catch(e){ sintetizar(retraso, tono); }
}

function sintetizar(retraso, tono){
  try{
    if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === "suspended") audio.resume();
  }catch(e){ return; }

  const t0 = audio.currentTime + retraso, dur = 0.55;
  const osc = audio.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(380*tono, t0);
  osc.frequency.linearRampToValueAtTime(700*tono, t0 + dur*0.22);
  osc.frequency.exponentialRampToValueAtTime(300*tono, t0 + dur);

  const vib = audio.createOscillator(), vibG = audio.createGain();
  vib.frequency.value = 22; vibG.gain.value = 12*tono;
  vib.connect(vibG).connect(osc.frequency);

  const mezcla = audio.createGain();
  [[320,800,360,1],[2300,1250,760,0.5]].forEach(f => {
    const bp = audio.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 6;
    bp.frequency.setValueAtTime(f[0], t0);
    bp.frequency.linearRampToValueAtTime(f[1], t0 + dur*0.3);
    bp.frequency.linearRampToValueAtTime(f[2], t0 + dur);
    const g = audio.createGain(); g.gain.value = f[3];
    osc.connect(bp).connect(g).connect(mezcla);
  });

  const salida = audio.createGain();
  salida.gain.setValueAtTime(0.0001, t0);
  salida.gain.exponentialRampToValueAtTime(0.22, t0 + 0.06);
  salida.gain.setValueAtTime(0.22, t0 + dur*0.55);
  salida.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  mezcla.connect(salida).connect(audio.destination);

  osc.start(t0); vib.start(t0);
  osc.stop(t0 + dur + 0.02); vib.stop(t0 + dur + 0.02);
}
let capaGatos = null, tempGatos, tempSalida;
$("#miau").addEventListener("click", () => {
  clearTimeout(tempGatos); clearTimeout(tempSalida);
  if(!capaGatos){
    capaGatos = document.createElement("div");
    capaGatos.className = "gatos";
    capaGatos.setAttribute("aria-hidden", "true");
    const img = document.createElement("img");
    img.src = "datos/miau.webp";          /* se pide solo al pulsar */
    img.alt = "";
    capaGatos.appendChild(img);
  }
  capaGatos.classList.remove("yendose");
  document.body.appendChild(capaGatos);
  maullar(0, 1);        /* un maullido por gato, con tonos distintos */
  maullar(0.62, 0.82);
  tempGatos = setTimeout(() => {
    capaGatos.classList.add("yendose");
    tempSalida = setTimeout(() => capaGatos.remove(), 350);
  }, 2000);
});

    const par = await Promise.all([traer("datos/episodios.json"), traer("datos/lexico.json")]);
    EPS = par[0];
    DEBUT = par[1].d;
    LEX = par[1].l.split("\n").map(r => { const c = r.split("\t"); c[6] = +c[6]; return c; });
    $("#totales").innerHTML = LEX.length.toLocaleString("es") + " palabras · " +
      EPS.length + " episodios";
    const inicial = EPS.find(e=>e.id===location.hash.slice(1)) || EPS[0];
    await irA(inicial.id);

    $("#totales").textContent = "";
    $("#contenido").innerHTML = '<p class="aviso"><b>No se pudieron cargar los datos</b>' +
      esc(err.message) + ".<br>Si has abierto el archivo con doble clic, el navegador bloquea " +
      "la lectura de <code>datos/</code>. Sirve la carpeta con " +
      "<code>python3 -m http.server</code> y entra en <code>localhost:8000</code>.</p>";
  }
})();
